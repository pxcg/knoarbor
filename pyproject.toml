[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knoarbor"
version = "2.3.1"
description = "KnoArbor is a local-first AI knowledge system for compiling, maintaining, and querying documents, conversations, and wiki pages."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "KnoArbor contributors" }
]
keywords = ["llm", "wiki", "knowledge-base", "markdown", "obsidian", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = [
  "certifi==2026.5.20",
  "fastapi==0.115.0",
  "uvicorn==0.32.0",
  "pydantic==2.9.2",
  "PyYAML==6.0.2",
]

[project.urls]
Homepage = "https://github.com/pxcg/knoarbor"
Repository = "https://github.com/pxcg/knoarbor"
Issues = "https://github.com/pxcg/knoarbor/issues"
Documentation = "https://github.com/pxcg/knoarbor/tree/main/docs"

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "ruff==0.8.6",
]

[project.scripts]
knoarbor = "knoarbor.cli:main"
knoar = "knoarbor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knoarbor" = ["config.example.yaml", "product_manifest.json"]
"knoarbor.examples" = ["*.md"]
"knoarbor.semantic.prompts" = ["*.md"]

[tool.ruff]
target-version = "py312"
line-length = 140
exclude = [
  ".git",
  ".venv",
  ".uv-cache",
  "build",
  "dist",
  "web",
  "wiki",
]
