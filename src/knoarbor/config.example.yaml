# Copy this file to config.yaml and adjust local paths.
# Secrets do not belong here. Put API keys and tokens in .env, then reference
# their environment variable names through *_env fields.

project:
  # Display name of this specific wiki vault. Change it when you create a new
  # knowledge base.
  name: My Knowledge Base
  host_project_root: .

config_version: 1

vaults:
  default: default
  profiles:
    default:
      name: My Knowledge Base
      path: ./vaults/default

# `vault` is the active vault resolved from `vaults.default`. It is kept for
# existing CLI/API internals and simple one-vault deployments.
vault:
  path: ./vaults/default

server:
  host: 127.0.0.1
  port: 8000

models:
  # Pick one provider as the default model for all semantic workflows. Add more
  # providers only when you need them. Most providers use the
  # OpenAI-compatible Chat Completions adapter; Ollama can also use its native
  # /api/chat adapter for thinking models.
  default_provider: deepseek
  # Wiki ingest/lint runs can be long because they compile or review multiple
  # pages. Keep these defaults larger than short chat-tool calls.
  default_max_tokens: 30000
  request_timeout_seconds: 600
  providers:
    deepseek:
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      json_mode: true
    # Local presets. Keep only one default provider selected above; uncomment
    # and edit one of these when using a local runtime.
    # ollama:
    #   adapter: ollama
    #   base_url: http://127.0.0.1:11434
    #   api_key_env:
    #   model: qwen3.6:27b-q4_K_M
    #   json_mode: true
    #   context_window: 262144
    #   max_output_tokens: 8000
    #   extra_body:
    #     think: false
    # ollama-openai-compatible:
    #   base_url: http://127.0.0.1:11434/v1
    #   api_key_env:
    #   model: qwen3:14b
    #   json_mode: true
    #   context_window: 32768
    #   max_output_tokens: 8000
    # vllm:
    #   base_url: http://127.0.0.1:8001/v1
    #   api_key_env:
    #   model: Qwen/Qwen3-32B-Instruct
    #   json_mode: true
    #   context_window: 32768
    #   max_output_tokens: 8000
    # qwen-vl:
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key_env: DASHSCOPE_API_KEY
    #   model: qwen3-vl-plus
    #   json_mode: false
    #   context_window: 262144
    #   max_output_tokens: 8000
  retry:
    enabled: true
    max_attempts: 3
    backoff_seconds: 2
    retry_on_invalid_output: true
    retryable_error_codes:
      - KA-EXT-001
      - KA-MODEL-001
      - KA-SEM-001
      - KA-STORAGE-001

document_processing:
  mineru:
    # Optional adapter for a user-managed MinerU 3.x-compatible HTTP service.
    # It converts rich documents into Markdown before the normal markdown
    # connector runs. When disabled, KnoArbor only reads existing Markdown.
    enabled: false
    # Example when running local source install:
    #   cd /path/to/MinerU
    #   .venv/bin/mineru-api --host 127.0.0.1 --port 18000
    endpoint: http://127.0.0.1:18000/file_parse
    input_dir: ./vaults/default/raw/documents/originals
    output_dir: ./vaults/default/raw/documents/markdown
    recursive: true
    patterns:
      - "*.pdf"
      - "*.docx"
      - "*.pptx"
    mode: auto
    timeout_seconds: 600
    file_field: files
    output_dir_field:
    mode_field: parse_method
    response_markdown_field: markdown
    response_path_field:
    headers: {}
    extra_fields:
      backend: pipeline
      lang_list: ch
      formula_enable: true
      table_enable: true
      start_page_id: 0
      end_page_id: 99999
      return_md: true
      return_middle_json: false
      return_model_output: false
      return_content_list: false
      return_images: false
      response_format_zip: false

connectors:
  codex:
    enabled: false
    settings:
      sessions_dir: ~/.codex/sessions
      pattern: "rollout-*.jsonl"
      recursive: true
      raw_output_dir: ./vaults/default/raw/chats
  hermes:
    enabled: false
    settings:
      sessions_dir: ~/.hermes/sessions
      raw_output_dir: ./vaults/default/raw/chats
  openclaw:
    enabled: false
    settings:
      sessions_dir: ~/.openclaw/agents/main/sessions
      pattern: "*.jsonl"
      recursive: false
      raw_output_dir: ./vaults/default/raw/chats
  claude_code:
    enabled: false
    settings:
      sessions_dir: ~/.claude/projects
      pattern: "*.jsonl"
      recursive: true
      raw_output_dir: ./vaults/default/raw/chats
  generic_chat:
    enabled: false
    settings:
      # Optional generic adapter for local JSONL or SQLite chat exports. Prefer
      # dedicated connectors above when the tool is known.
      roots: []
      patterns:
        - "*.jsonl"
        - "*.sqlite"
        - "*.db"
      recursive: true
      raw_output_dir: ./vaults/default/raw/chats
  markdown:
    enabled: true
    settings:
      roots:
        - ./vaults/default/raw/notes
        - ./vaults/default/raw/documents/markdown
      recursive: true
      raw_output_dir: ./vaults/default/raw/notes
      preserve_relative_paths: true

query:
  mode: balanced
  max_results: 6
  max_pages_to_read: 10
  max_excerpts_per_page: 3
  max_chars_per_excerpt: 800
  max_context_chars: 8000
  page_dirs: []
  include_related: true

memory:
  enabled: true
  auto_write_explicit_low_risk: true
  max_recalled_records: 12

chat:
  auto_ingest:
    # Manual chat-session ingest is always available through the chat API/UI.
    # This policy controls whether closing a KnoArbor chat automatically queues
    # that session into the normal ingest pipeline.
    enabled: false
    trigger: on_session_close
    min_user_turns: 2
    write: true
    write_report: true
    append_ledger: true

ingest:
  candidate_limit: 8
  materialized_page_limit: 8
  max_chars_per_materialized_page: 6000
  auto_scoped_lint: true
  auto_apply_safe_lint_fixes: true
  segmentation:
    enabled: true
    max_chars_per_segment: 18000
    soft_chars_per_segment: 12000
    overlap_chars: 1200
    max_segments_per_source: 20
    min_segment_chars: 1000
  recovery:
    enabled: true
    execution_ledger_path: maintenance/ingest_execution_ledger.jsonl
  concurrency:
    # Source-level concurrency applies to dry-run/preflight workflows. Vault
    # writes stay serial to keep page updates and checkpoints consistent.
    max_concurrent_sources: 1

lint:
  default_scope: latest-ingest
  scoped_include_related: true
  include_neighbors: true
  include_global_checks: true

privacy:
  redaction_enabled: true
  redact_emails: true
  redact_phone_numbers: true
  redact_api_keys: true
  redact_private_keys: true
  redact_platform_ids: true
  redact_local_paths: true
  redact_source_paths_in_pages: true
  redact_private_ips: false
  # Optional exact-match terms for names, hostnames, internal project aliases,
  # or organization-specific identifiers that generic regex rules cannot infer.
  custom_terms: []
