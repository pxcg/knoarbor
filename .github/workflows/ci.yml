name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python lint
        run: uv run --extra dev ruff check src tests scripts

      - name: Check documentation links
        run: uv run python scripts/check-doc-links.py

      - name: Run tests
        run: uv run --extra dev python -m unittest discover tests

  renderer:
    name: Renderer build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer
        working-directory: renderer
        run: npm run build

  desktop:
    name: Desktop smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            renderer/package-lock.json
            desktop/package-lock.json

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build renderer
        working-directory: renderer
        run: npm run build

      - name: Run desktop smoke tests
        working-directory: desktop
        run: npm run test:smoke

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: [test, renderer, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build
