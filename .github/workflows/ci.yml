name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python lint
        run: uv run --extra dev ruff check src tests scripts

      - name: Check documentation links
        run: uv run python scripts/check-doc-links.py

      - name: Check documentation governance
        run: uv run python scripts/check-doc-governance.py

      - name: Check architecture governance
        run: uv run python scripts/check-architecture.py

      - name: Check generated product identity
        run: uv run python scripts/generate-product-identity.py --check

      - name: Check public product boundary
        run: uv run python scripts/check-public-product-boundary.py

      - name: Run tests
        run: uv run --extra dev python -m unittest discover tests

  frontend:
    name: Frontend build and interaction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install frontend dependencies
        working-directory: renderer
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: renderer
        run: npm audit --audit-level=moderate

      - name: Build frontend
        working-directory: renderer
        run: npm run build

      - name: Install Chromium
        working-directory: renderer
        run: npx playwright install --with-deps chromium

      - name: Run frontend interaction tests
        working-directory: renderer
        run: npm run test:e2e

  desktop:
    name: Desktop contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            renderer/package-lock.json
            desktop/package-lock.json

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and test desktop contracts
        working-directory: desktop
        run: npm run build:renderer && npm run build && npm test && npm run verify:icons

      - name: Audit production desktop dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: [test, frontend, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build
