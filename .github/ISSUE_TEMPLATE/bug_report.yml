name: Bug report
description: Report a reproducible problem in KnoArbor.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, private notes, raw documents, screenshots with secrets, or company data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or git commit SHA"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ingest
        - lint
        - query
        - CLI
        - API
        - web console
        - configuration
        - documentation
        - other
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste only redacted logs.
      render: text
