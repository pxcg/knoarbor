name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the workflow problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow or system boundary does this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - connector
        - ingest
        - lint
        - query
        - storage
        - semantic contract
        - API
        - CLI
        - web console
        - documentation
        - other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Risks or boundary concerns
      description: Note privacy, token cost, hidden fallback behavior, or module-boundary concerns.
