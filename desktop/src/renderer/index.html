<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnoArbor Desktop</title>
    <style>
      :root {
        color: #16201c;
        background: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .panel {
        max-width: 520px;
        border: 1px solid #dbe5df;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 18px 50px rgba(31, 44, 38, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #59675f;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>KnoArbor Desktop</h1>
        <p>
          The desktop shell is starting. In packaged builds, this window is
          replaced by the local KnoArbor console after the managed Python
          service becomes healthy.
        </p>
      </section>
    </main>
  </body>
</html>
